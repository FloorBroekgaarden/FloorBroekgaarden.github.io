{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';

  // Apply the saved/system theme before the page paints, so dark mode doesn't flash light while main.min.js loads
  (function () {
    var root = document.documentElement, theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "dark" && theme !== "light") {
      theme = root.getAttribute("data-theme") ||
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    if (theme === "dark") root.setAttribute("data-theme", "dark");
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
